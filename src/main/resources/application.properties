# ===========================
# Spring Boot (BASE / dev)
# ===========================
spring.application.name=autobridge-api
# Cloud Run sets $PORT; keep 8080 for local
server.port=${PORT:8080}

# Time & JSON
spring.jackson.time-zone=UTC

# ===========================
# JPA / Flyway
# ===========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true

# ===========================
# File uploads (local/dev)
# ===========================
autobridge.upload-dir=uploads
spring.web.resources.static-locations=file:uploads/

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===========================
# Swagger (unchanged)
# ===========================
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs

# ===========================
# JWT (dev default; override in prod via env)
# ===========================
app.jwt.secret=${APP_JWT_SECRET:ChangeMe_This_Is_A_Strong_Secret_Key_AtLeast32Chars}
app.jwt.exp-min=${APP_JWT_EXP_MIN:120}
app.adminInviteCode=${APP_ADMIN_INVITE_CODE:AB-ADMIN-2025}
app.agentInviteCode=${APP_AGENT_INVITE_CODE:AB-AGENT-2025}

# ===========================
# CORS (env-driven; patterns allow Cloud Run URLs)
# Add/remove origins without code changes.
# ===========================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:https://*.a.run.app}

# ===========================
# Mail (dev placeholders; set via env when needed)
# DO NOT hard-code passwords
# ===========================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.protocol=${SPRING_MAIL_PROTOCOL:smtps}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ===========================
# Logging & error detail (dev-friendly)
# ===========================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=true

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.mail.javamail=DEBUG
logging.level.com.sun.mail.smtp=DEBUG
spring.mail.properties.mail.debug=true

# Misc
spring.docker.compose.enabled=false
