spring.application.name=autobridge-api

server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/autobridge?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=autobridge
spring.datasource.password=autobridge

#JPA (dev)
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.time-zone=UTC

#Swagger
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs

# file uploads
autobridge.upload-dir=uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB



#Don?t auto-manage Docker compose
spring.docker.compose.enabled=false


# JWT
app.jwt.secret=ChangeMe_This_Is_A_Strong_Secret_Key_AtLeast32Chars
app.jwt.exp-min=120

# Invite codes for privileged signups (simple, dev-friendly safety)

app.adminInviteCode=AB-ADMIN-2025
app.agentInviteCode=AB-AGENT-2025



# JPA schema handling
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# show why a request failed
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param



server.error.include-exception=true
logging.level.org.springframework.web=DEBUG
logging.level.com.autobridge_api=DEBUG


