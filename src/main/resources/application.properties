# =========================================
# Password Reset ? user table/column names
# (Only set these if your schema differs.)
# Defaults assumed by the service are:
#   table=users, email column=email, password column=password
# =========================================
autobridge.auth.user-table-name=users
autobridge.auth.user-email-column=email
autobridge.auth.user-password-column=password_hash




