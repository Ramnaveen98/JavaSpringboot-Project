# ===========================
# Spring Boot (PROD profile)
# ===========================
spring.application.name=autobridge-api
server.port=8080
server.forward-headers-strategy=framework

# Time & JSON
spring.jackson.time-zone=UTC

# ===========================
# Database (Cloud SQL)
# Values injected via env/Secret Manager
# ===========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/autobridge?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true

# ===========================
# Static files / Uploads
# GCS bucket is mounted to /mnt/gcs/uploads via Cloud Run + GCS FUSE
# ===========================
spring.web.resources.static-locations=file:/mnt/gcs/uploads/
autobridge.upload-dir=/mnt/gcs/uploads

# Multipart limits (keep same as dev)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===========================
# Swagger (unchanged)
# ===========================
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs

# ===========================
# JWT & App Secrets (env-driven)
# ===========================
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.exp-min=${APP_JWT_EXP_MIN:120}

# Optional: keep invite codes in env for prod
app.adminInviteCode=${APP_ADMIN_INVITE_CODE:AB-ADMIN-2025}
app.agentInviteCode=${APP_AGENT_INVITE_CODE:AB-AGENT-2025}

# ===========================
# Mail (env-driven in prod)
# Use your provider (e.g., SendGrid SMTP, Gmail App Password, etc.)
# For Gmail App Password, prefer 465 + SMTPS (ssl.enable=true)
# For SendGrid, prefer 587 + STARTTLS
# ===========================
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.protocol=${SPRING_MAIL_PROTOCOL:smtp}

# TLS options; choose per provider
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ===========================
# Production logging & errors
# ===========================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.autobridge_api=INFO

# Don?t leak stacktraces/messages by default in prod HTTP errors
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ===========================
# Misc
# ===========================
spring.docker.compose.enabled=false
