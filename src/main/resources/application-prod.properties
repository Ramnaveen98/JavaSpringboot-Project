# ===========================
# Spring Boot (PROD profile)
# ===========================
spring.application.name=autobridge-api
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.jackson.time-zone=UTC

# ===========================
# Database (Cloud SQL via SocketFactory)
# Set these ENV VARS in Cloud Run:
#   CLOUDSQL_INSTANCE = <PROJECT_ID>:<REGION>:<INSTANCE_NAME>
#   SPRING_DATASOURCE_USERNAME = <db_user>
#   SPRING_DATASOURCE_PASSWORD = (map from Secret Manager)
# ===========================
spring.datasource.url=jdbc:mysql:///autobridge?cloudSqlInstance=${CLOUDSQL_INSTANCE}&socketFactory=com.google.cloud.sql.mysql.SocketFactory&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# JPA / Flyway
# ===========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true

# ===========================
# Static files / Uploads (Cloud Run + GCS FUSE)
# If you mount a bucket to /mnt/gcs/uploads
# ===========================
autobridge.upload-dir=/mnt/gcs/uploads
#spring.web.resources.static-locations=file:/mnt/gcs/uploads/

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===========================
# Swagger (unchanged)
# ===========================
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs

# ===========================
# JWT & App Secrets (env-driven in prod)
# ===========================
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.exp-min=${APP_JWT_EXP_MIN:120}
app.adminInviteCode=${APP_ADMIN_INVITE_CODE:AB-ADMIN-2025}
app.agentInviteCode=${APP_AGENT_INVITE_CODE:AB-AGENT-2025}

# ===========================
# CORS (tighten to your frontend domains as you go)
# Keep *.a.run.app while testing.
# ===========================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:https://*.a.run.app}

# ===========================
# Mail (env-driven in prod)
# ===========================
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.protocol=${SPRING_MAIL_PROTOCOL:smtp}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ===========================
# Production logging & errors
# ===========================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.autobridge_api=INFO

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Misc
spring.docker.compose.enabled=false
